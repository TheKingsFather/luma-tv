plugins { id 'com.android.application' }
android {
    namespace 'tv.luma'
    compileSdk 34
    defaultConfig {
        applicationId 'tv.luma'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '0.6.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (System.getenv('LUMA_SIGNING_KEYSTORE')) {
            ownerRelease {
                storeFile file(System.getenv('LUMA_SIGNING_KEYSTORE'))
                storePassword System.getenv('LUMA_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('LUMA_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('LUMA_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (System.getenv('LUMA_SIGNING_KEYSTORE')) signingConfig signingConfigs.ownerRelease
        }
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

